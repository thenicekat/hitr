name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm + darwin targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}

      - name: Install dioxus-cli
        uses: baptiste0928/cargo-install@v3
        with:
          crate: dioxus-cli
          version: "^0.7"
          locked: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # ad-hoc sign — no Apple Developer cert, but bypasses xattr for
          # most users. First launch still shows Gatekeeper right-click prompt.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json

  verify-updates:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify the updater manifest for both Mac architectures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json
          jq -e --arg version "${GITHUB_REF_NAME#v}" '
            .version == $version and
            (.platforms["darwin-aarch64"] | .signature != "" and .signature != null and (.url | endswith(".app.tar.gz"))) and
            (.platforms["darwin-x86_64"] | .signature != "" and .signature != null and (.url | endswith(".app.tar.gz")))
          ' latest.json
